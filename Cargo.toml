[package]
name = "png-text-viewer"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
eframe = { version = "0.36.1", features = ["persistence"] }
egui_extras = "0.36.1"
flate2 = "1.1.9"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rfd = "0.17.2"
serde_json = { version = "1.0.151", features = ["preserve_order"] }

# Optimize dependencies even in dev builds: PNG decoding is far too slow at opt-level 0.
[profile.dev.package."*"]
opt-level = 2

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unused_crate_dependencies = "warn"
unused_results = "deny"
missing_debug_implementations = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
unwrap_used = "deny"

[profile.release]
strip = true
lto = "thin"
