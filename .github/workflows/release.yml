name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: png-metadata-gui

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            ext: .exe
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
            ext: ""
          - os: macos-13
            target: x86_64-apple-darwin
            platform: macos-x86_64
            ext: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          ARCHIVE="$BIN_NAME-${{ github.ref_name }}-${{ matrix.platform }}.zip"
          mkdir package
          cp "target/${{ matrix.target }}/release/$BIN_NAME${{ matrix.ext }}" package/
          cp README.md LICENSE package/
          cd package
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../$ARCHIVE" .
          else
            zip -r "../$ARCHIVE" .
          fi
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
